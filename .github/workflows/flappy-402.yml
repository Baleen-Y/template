name: Flappy BLE 4.0.2 resource compatibility
on:
  push:
    branches: [flappy-ble-v4.0.2]
    paths: ['source/flappy-ble/**', '.github/workflows/flappy-402.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archive tracked module source and release
        run: git archive --format=zip --output=flappy-source.zip HEAD source/flappy-ble flappy-ble .github/workflows
      - uses: actions/upload-artifact@v4
        with:
          name: flappy-402-source
          path: flappy-source.zip
          retention-days: 7
