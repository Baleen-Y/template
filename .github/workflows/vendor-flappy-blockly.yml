name: Vendor Blockly for Flappy BLE

on:
  push:
    paths:
      - '.github/workflows/vendor-flappy-blockly.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download pinned Blockly runtime
        run: |
          set -euo pipefail
          mkdir -p flappy-ble/assets/vendor
          curl -fsSL --retry 3 "https://unpkg.com/blockly@13.3.0/blockly.min.js" -o flappy-ble/assets/vendor/blockly.min.js
          test -s flappy-ble/assets/vendor/blockly.min.js
          grep -q "serialization" flappy-ble/assets/vendor/blockly.min.js
      - name: Commit vendored runtime
        run: |
          if git diff --quiet -- flappy-ble/assets/vendor/blockly.min.js; then
            echo "Blockly runtime already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flappy-ble/assets/vendor/blockly.min.js
          git commit -m "Vendor Blockly 13.3.0 for Flappy BLE"
          git push
