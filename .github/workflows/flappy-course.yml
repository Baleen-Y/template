name: Build and test Flappy course
on:
  push:
    branches: [flappy-ble-v4, flappy-ble-import-fix]
    paths: ['source/flappy-ble/**', '.github/workflows/flappy-course.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: flappy-course-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned development dependencies
        working-directory: source/flappy-ble
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Compile TypeScript and enforce clean resource packaging
        working-directory: source/flappy-ble
        run: npm run build
      - name: Unit, protocol and import-path regression tests
        working-directory: source/flappy-ble
        run: |
          mkdir -p test-results
          set -o pipefail
          npm test | tee test-results/core.tap
      - name: Install test browser
        working-directory: source/flappy-ble
        run: npx playwright install --with-deps chromium
      - name: Real Blockly course tests with mocked SDK
        working-directory: source/flappy-ble
        run: npm run test:browser
      - name: Cursor and resource-loading regression test
        working-directory: source/flappy-ble
        run: npm run test:media
      - name: Record evidence, package and validate every ZIP member
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, zipfile, stat
          root=pathlib.Path('flappy-ble')
          manifest=json.loads((root/'module.json').read_text())
          version=manifest['version']
          report=json.loads(pathlib.Path('source/flappy-ble/test-results/browser.json').read_text())
          media=json.loads(pathlib.Path('source/flappy-ble/test-results/import-media.json').read_text())
          text='# Verification — Flappy BLE '+version+'\n\nSource commit: '+os.environ['SOURCE_COMMIT']+'\n\n'
          text+='Strict TypeScript build and production unit/protocol/packaging tests passed.\n\nBrowser: '+report['browser']+'\n\n'+report['mode']+'\n\n'
          text+='\n'.join('- '+x for x in report['checks']+media['checks'])+'\n\n'
          text+='The reported .cur rejection is covered by a negative regression test. Every final ZIP member is checked against a conservative local path/extension policy. Actual iCreator App/web import, official module-kit validator and physical BLE hardware: NOT TESTED.\n'
          (root/'VERIFICATION.md').write_text(text)
          pathlib.Path('downloads').mkdir(exist_ok=True)
          archive=pathlib.Path('downloads')/('flappy-ble-'+version+'.zip')
          allowed={'.html','.js','.css','.json','.md','.txt','.png','.svg'}
          paths=sorted(p for p in root.rglob('*') if p.is_file())
          with zipfile.ZipFile(archive,'w',zipfile.ZIP_DEFLATED) as z:
            for p in paths:
              assert not p.is_symlink(), p
              assert p.suffix.lower() in allowed, p
              z.write(p,p.as_posix())
          with zipfile.ZipFile(archive) as z:
            names=z.namelist()
            assert len(names)==len(set(n.casefold() for n in names))
            assert 'flappy-ble/module.json' in names and 'flappy-ble/index.html' in names
            for n in names:
              parts=n.split('/')
              assert parts[0]=='flappy-ble' and all(x not in ('','.','..') for x in parts)
              assert '\\' not in n and ':' not in n and pathlib.PurePosixPath(n).suffix.lower() in allowed
            assert z.testzip() is None
          print('ZIP validated:', archive, 'members:', len(names), 'bytes:', archive.stat().st_size)
          pathlib.Path('source/flappy-ble/test-results/archive.json').write_text(json.dumps({'file':str(archive),'members':names,'bytes':archive.stat().st_size},indent=2))
          PY
      - name: Commit tested source stamps and release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          VERSION=$(node -p "require('./source/flappy-ble/package.json').version")
          git add -A flappy-ble
          git add "downloads/flappy-ble-${VERSION}.zip" source/flappy-ble/package-lock.json source/flappy-ble/src/model.ts source/flappy-ble/static
          git diff --cached --quiet || git commit -m "Build import-safe Flappy BLE ${VERSION} release"
          git push origin HEAD:${{ github.ref_name }}
      - name: Keep tests and the exact release ZIP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flappy-import-fix-evidence
          path: |
            source/flappy-ble/test-results
            downloads/flappy-ble-4.0.1.zip
          retention-days: 30
