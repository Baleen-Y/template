name: Build and test Flappy course
on:
  push:
    branches: [flappy-ble-v4, flappy-ble-import-fix, flappy-ble-v4.0.2]
    paths: ['source/flappy-ble/**', '.github/workflows/flappy-course.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: flappy-course-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Apply reviewed source delta when present
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, pathlib, subprocess, shutil
          directory=pathlib.Path('source/flappy-ble/updates/402blob')
          if directory.exists():
            encoded=''.join((directory/str(i)).read_text().strip() for i in range(8))
            raw=gzip.decompress(base64.b64decode(encoded,validate=True))
            assert hashlib.sha256(raw).hexdigest()=='39afa5afe204ec045f380fe1d21f8c38f7d85c0abdfb90df010559ae2a8ffdca', 'Source delta checksum mismatch'
            subprocess.run(['git','apply','--check','--unidiff-zero','-'],input=raw,check=True)
            subprocess.run(['git','apply','--unidiff-zero','-'],input=raw,check=True)
            shutil.rmtree('source/flappy-ble/updates')
            print('Reviewed delta applied and temporary transport segments removed')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked development dependencies
        working-directory: source/flappy-ble
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Strict TypeScript build and preserve complete upstream resources
        working-directory: source/flappy-ble
        run: npm run build
      - name: Production unit, protocol, teaching feedback and packaging checks
        working-directory: source/flappy-ble
        run: |
          mkdir -p test-results
          set -o pipefail
          npm test | tee test-results/core.tap
      - name: Install test browser
        working-directory: source/flappy-ble
        run: npx playwright install --with-deps chromium
      - name: Real Blockly three-stage course with mocked iCreator SDK
        working-directory: source/flappy-ble
        run: npm run test:browser
      - name: Custom cursors, all media and nested resource-path regression tests
        working-directory: source/flappy-ble
        run: npm run test:media
      - name: Record evidence and validate the final ZIP
        working-directory: source/flappy-ble
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: node --experimental-strip-types package-release.ts
      - name: Commit tested release and complete editable TypeScript source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          VERSION=$(node -p "require('./source/flappy-ble/package.json').version")
          git add -A flappy-ble
          git add -u source/flappy-ble
          git add source/flappy-ble/src/lesson-feedback.ts source/flappy-ble/src/resources.ts source/flappy-ble/tests/feedback.test.ts source/flappy-ble/package-release.ts
          git add "downloads/flappy-ble-${VERSION}.zip"
          git diff --cached --quiet || git commit -m "Publish tested Flappy BLE ${VERSION} resources and teaching refinements"
          git push origin HEAD:${{ github.ref_name }}
          git archive --format=zip --output=flappy-tested-source.zip HEAD source/flappy-ble flappy-ble
      - name: Retain test evidence, release ZIP and source snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flappy-402-release-evidence
          path: |
            source/flappy-ble/test-results
            downloads/flappy-ble-4.0.2.zip
            flappy-tested-source.zip
          retention-days: 30
